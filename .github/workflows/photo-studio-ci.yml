name: Private Photo Studio checks
on:
  push:
    paths:
      - 'locket-backend/**'
      - 'render.yaml'
      - 'locket-personal.js'
      - '.github/workflows/photo-studio-ci.yml'
  pull_request:
    paths:
      - 'locket-backend/**'
      - 'render.yaml'
      - '.github/workflows/photo-studio-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and test FastAPI backend
        working-directory: locket-backend
        run: |
          python -m pip install -r requirements.txt pytest httpx
          python -m pytest -q
      - name: Test read-only Shadowrocket script
        working-directory: locket-backend
        run: node tests/test_contract_probe.cjs
      - name: Test metadata-only PTB observer data minimization
        working-directory: locket-backend
        run: node tests/test_ptb_contract_v2.cjs
      - name: Test isolated native PTB catalog experiment
        working-directory: locket-backend
        run: node tests/test_ptb_catalog.cjs
      - name: Test one-endpoint getFilters preview contract
        working-directory: locket-backend
        run: node tests/test_ptb_getfilters.cjs
      - name: Test getFilters response-level compatibility trial
        working-directory: locket-backend
        run: node tests/test_ptb_getfilters_response_compat.cjs
      - name: Test combined Firebase PTB catalog trial
        working-directory: locket-backend
        run: node tests/test_ptb_remoteconfig_combined.cjs
      - name: Test merged personal PTB keeps video and other settings
        working-directory: locket-backend
        run: node tests/test_ptb_personal_merged.cjs
      - name: Test passive PTB image API status observer
        working-directory: locket-backend
        run: node tests/test_ptb_image_api_status.cjs
      - name: Test read-only PTB Firebase observer V3
        working-directory: locket-backend
        run: node tests/test_ptb_firebase_observer_v3.cjs
      - name: Test iPhone-visible PTB Firebase observer V4
        working-directory: locket-backend
        run: node tests/test_ptb_firebase_observer_v4.cjs
      - name: Test merged personal PTB preserves existing configuration
        working-directory: locket-backend
        run: node tests/test_personal_ptb_merged.cjs

      - name: Test opt-in sanitized PTB response observer
        working-directory: locket-backend
        run: node tests/test_ptb_safe_response_observer.cjs

      - name: Test scoped PTB image-delivery observer
        working-directory: locket-backend
        run: node tests/test_ptb_image_delivery_observer.cjs

      - name: Test experimental native PTB Shadowrocket redirect
        working-directory: locket-backend
        run: node tests/test_native_ptb_redirect.cjs

      - name: Smoke test running FastAPI (including a real PNG render)
        working-directory: locket-backend
        shell: bash
        env:
          PHOTOBOOTH_REQUIRE_AUTH: "1"
          PHOTOBOOTH_API_KEY: ci-nonproduction-synthetic-secret
        run: |
          python -m uvicorn app:app --host 127.0.0.1 --port 8188 >/tmp/photobooth-uvicorn.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8188/health >/dev/null; then break; fi
            sleep 1
          done
          python smoke_deploy.py http://127.0.0.1:8188

  launcher-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows iPhone launcher
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("locket-backend/connect-iphone.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Host
            exit 1
          }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("locket-backend/run-local-ptb.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("locket-backend/smoke-staging.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("locket-backend/setup-http-toolkit.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Host
            exit 1
          }
