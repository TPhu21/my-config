# Blueprint file at TPhu21/my-config repository root
services:
  - type: web
    name: phu-private-photo-studio
    runtime: python
    plan: free
    branch: main
    rootDir: locket-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: PHOTOBOOTH_REQUIRE_AUTH
        value: "1"
      - key: PHOTOBOOTH_API_KEY
        sync: false
